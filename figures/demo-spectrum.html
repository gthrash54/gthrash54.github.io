<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo spectrum</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>html,body{margin:0;height:100%;background:transparent}#p{width:100%;height:100vh}</style>
</head><body><div id="p"></div>
<script>
// Synthetic power spectra: 1/f background + beta peak (20 Hz), reduced during speech. No real data.
const f=[]; for(let x=1;x<=100;x+=0.5) f.push(x);
function psd(betaGain, seed){ let s=seed; const r=()=>{s=(s*9301+49297)%233280; return s/233280;};
  return f.map(x=>{ const bg=12/Math.pow(x,1.1); const beta=betaGain*Math.exp(-Math.pow((x-20)/2.8,2)); const gamma=0.25*Math.exp(-Math.pow((x-70)/8,2)); return 10*Math.log10(bg+beta+gamma+0.05)+ (r()-0.5)*0.6; }); }
const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
const ink = dark ? '#c3c1b9' : '#4a4843', grid = dark ? '#2c3036' : '#e4e1d9';
document.documentElement.style.background = dark ? '#1c1f23' : '#ffffff';
Plotly.newPlot('p', [
  {x:f, y:psd(1.6, 7), name:'Rest', mode:'lines', line:{color:'#1f5f4a', width:2.2}, hovertemplate:'%{x:.1f} Hz · %{y:.1f} dB<extra>Rest</extra>'},
  {x:f, y:psd(0.7, 11), name:'Speech', mode:'lines', line:{color:'#c26b2b', width:2.2}, hovertemplate:'%{x:.1f} Hz · %{y:.1f} dB<extra>Speech</extra>'}
], {
  margin:{l:56,r:16,t:36,b:48}, paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(0,0,0,0)',
  font:{family:'Inter, system-ui, sans-serif', size:12, color:ink},
  title:{text:'Synthetic STN LFP power spectrum (demo)', x:0.02, font:{size:14}},
  xaxis:{title:'Frequency (Hz)', gridcolor:grid, zeroline:false, range:[1,100]},
  yaxis:{title:'Power (dB)', gridcolor:grid, zeroline:false},
  legend:{orientation:'h', x:1, xanchor:'right', y:1.12},
  shapes:[{type:'rect', x0:13, x1:30, y0:0, y1:1, yref:'paper', fillcolor: dark ? 'rgba(127,196,165,0.08)' : 'rgba(31,95,74,0.07)', line:{width:0}}],
  annotations:[{x:21.5, y:1.02, yref:'paper', text:'beta band', showarrow:false, font:{size:11, color:ink}}]
}, {responsive:true, displaylogo:false, modeBarButtonsToRemove:['lasso2d','select2d']});
</script></body></html>
